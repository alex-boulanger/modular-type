# Cloudflare Pages project.
#
# `name` is the project the deploy uploads to, and
# `pages_build_output_dir` is what gets uploaded. The workflow runs
# `wrangler pages deploy` without a directory argument so this file remains the
# deploy source of truth.
#
# The custom domain (modular-typography.alex-boulanger.dev) is not configured here. Pages custom
# domains live on the account, not in the repo.

name = "modular-typography"
compatibility_date = "2026-09-11"
pages_build_output_dir = "dist"